name: PR Gate

on:
  pull_request:
    branches: [main]

jobs:
  bundle-check:
    name: Pimcore bundle check (PR)
    uses: nikolareljin/ci-helpers/.github/workflows/pimcore.yml@c9096ef747ee18ed98945bae6c012b08ddc75eec
    with:
      # Pimcore 12 requires ~8.3.0 || ~8.4.0; 8.1 and 8.2 cannot resolve it.
      php_versions: '["8.3", "8.4"]'
      compose_file: docker-test/docker-compose.yml
      bundle_src: "."
      bundle_src_env: BUNDLE_SRC
      php_service: php
      db_service: db
      db_wait_seconds: "30"
      out_dir: docker-test/tmp
      composer_command: "composer install --no-interaction --prefer-dist"
      phpcs_command: "vendor/bin/phpcs"
      phpunit_command: "vendor/bin/phpunit --testdox"
      fail_on_findings: true
      upload_artifact: true
      artifact_name: nr-enrich-core-pr-results
