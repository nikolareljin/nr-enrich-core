name: CI

on:
  push:
    branches: [main]

jobs:
  bundle-check:
    name: Pimcore bundle check
    # Pinned to the squash commit of ci-helpers#154 on main, which carries
    # php_versions. Not @production: that tag has not advanced to 0.22.0 yet
    # and has no such input, so it would fail on an unexpected key. Not the
    # release branch either -- #154 was squash-merged, so those commits are
    # not on main and go away with the branch. Repin to @production once
    # 0.22.0 is released.
    uses: nikolareljin/ci-helpers/.github/workflows/pimcore.yml@6e335c2f767a3aa6d391208779e0ce0bc02066bf
    with:
      # Pimcore 12 requires ~8.3.0 || ~8.4.0; 8.1 and 8.2 cannot resolve it.
      php_versions: '["8.3", "8.4"]'
      compose_file: docker-test/docker-compose.yml
      bundle_src: "."
      bundle_src_env: BUNDLE_SRC
      php_service: php
      db_service: db
      db_wait_seconds: "30"
      out_dir: docker-test/tmp
      composer_command: "composer install --no-interaction --prefer-dist"
      phpcs_command: "vendor/bin/phpcs"
      phpunit_command: "vendor/bin/phpunit --testdox"
      phpunit_coverage_command: "XDEBUG_MODE=coverage vendor/bin/phpunit"
      fail_on_findings: true
      upload_artifact: true
      artifact_name: nr-enrich-core-ci-results
